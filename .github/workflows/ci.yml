name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Validate project structure
        run: pnpm run validate

      - name: Validate ONNX models
        run: node scripts/validate-onnx-models.js
        continue-on-error: true

      - name: Check DSP isolation
        run: node scripts/check-dsp-isolation.js
        continue-on-error: true

      - name: Check duplicate JSON keys
        run: node scripts/check-duplicate-keys.js
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for eval/new Function in source
        run: |
          if grep -rn "eval(" public/app/*.js --include="*.js" | grep -v "//.*eval\|'use strict'" | grep -q .; then
            echo "WARNING: Found eval() usage in production JS — review required"
          else
            echo "OK: No eval() in production JS"
          fi

      - name: Verify no CDN URLs in JS source
        run: |
          if grep -rn "cdn.jsdelivr.net\|cdnjs.cloudflare.com\|unpkg.com" public/app/*.js; then
            echo "FAIL: CDN URLs found in JS source (violates RULE 4)"
            exit 1
          else
            echo "OK: No CDN URLs in production JS"
          fi

      - name: Verify COOP/COEP headers in vercel.json
        run: |
          node -e "
            const v = JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'));
            const blocks = (v.headers || []).filter(h =>
              h.headers && h.headers.some(x => x.key === 'Cross-Origin-Opener-Policy')
            );
            if (!blocks.length) { console.error('FAIL: No COOP header found'); process.exit(1); }
            for (const b of blocks) {
              const coep = b.headers.find(x => x.key === 'Cross-Origin-Embedder-Policy');
              if (coep && coep.value !== 'require-corp') {
                console.error('FAIL: COEP must be require-corp, got:', coep.value);
                process.exit(1);
              }
            }
            console.log('OK: COOP/COEP headers verified');
          "

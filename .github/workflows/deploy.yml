name: CI & Deploy

# Deployments consume verified code; they do not decide whether it is
# verified. This workflow starts only after the `ci` production gate finishes
# and deploys the exact head SHA that gate passed.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # NOTE: Do not use `secrets.*` in job-level `if:` — GitHub can fail the whole
  # workflow with "workflow file issue" and zero jobs. Gate on event/ref only;
  # skip inside steps when VERCEL_TOKEN is empty (Vercel Git integration still deploys).
  deploy-preview:
    name: Deploy Preview
    # Same-repository PRs only: workflow_run carries secrets, so fork code is never deployed with them.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Record verified SHA
        run: echo "Deploying ${{ github.event.workflow_run.head_sha }} verified by ci run ${{ github.event.workflow_run.id }}"
      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel
      - name: Pull Vercel Environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
      - name: Deploy Preview
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --token=$VERCEL_TOKEN
      - name: Skip deploy (no VERCEL_TOKEN configured)
        if: env.VERCEL_TOKEN == ''
        run: echo "⚠️  Skipping Vercel CLI preview — VERCEL_TOKEN not set (Git-connected Vercel may still deploy)."

  deploy-production:
    name: Deploy Production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Record verified SHA
        run: echo "Deploying ${{ github.event.workflow_run.head_sha }} verified by ci run ${{ github.event.workflow_run.id }}"
      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel
      - name: Pull Vercel Environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Deploy Production
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prod --token=$VERCEL_TOKEN
      - name: Skip deploy (no VERCEL_TOKEN configured)
        if: env.VERCEL_TOKEN == ''
        run: echo "⚠️  Skipping Vercel CLI production — VERCEL_TOKEN not set (Git-connected Vercel may still deploy)."

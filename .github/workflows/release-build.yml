name: Android Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v24.0.0)'
        required: false

jobs:
  # Pin one SHA so the gate and the build see the same commit even if a tag moves.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # github.sha is the immutable commit that triggered this run; a branch or
      # tag ref can move while the run is queued. Only a manual dispatch names a tag.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Release artifacts are built only from a SHA the production gate passed.
  gate:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  bundle-release:
    needs: [resolve, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Android release does not need Electron binaries; postinstall download flakes CI.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Avoid optional desktop tooling side-effects during web/android asset build.
      npm_config_ignore_scripts: ''

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          # Match packageManager in package.json (pnpm 11.x); avoid drift with 9.x
          corepack prepare pnpm@11.3.0 --activate

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          # electron postinstall still runs unless skip is set (set above)

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor Android assets
        run: pnpm exec cap sync android

      - name: Decode Android keystore
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${ANDROID_KEYSTORE_PATH}"

      - name: Verify ONNX model assets copied for bundled mode
        run: |
          test -f android/app/src/main/assets/public/app/models/silero_vad.onnx
          test -f android/app/src/main/assets/public/app/models/rnnoise_suppressor.onnx
          test -f android/app/src/main/assets/public/app/models/bsrnn_vocals.onnx

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      # Traceability: version, exact commit, build environment, model manifest
      # and artifact hash travel with the AAB.
      - name: Write release manifest and SHA-256 sums
        shell: bash
        run: |
          set -euo pipefail
          out=android/app/build/outputs/bundle/release
          (cd "$out" && sha256sum *.aab > SHA256SUMS)
          node -e '
            const fs = require("fs"); const crypto = require("crypto"); const path = require("path");
            const out = process.argv[1];
            const sha = (f) => crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
            const artifacts = fs.readdirSync(out).filter((f) => f.endsWith(".aab"))
              .map((f) => ({ name: f, bytes: fs.statSync(path.join(out, f)).size, sha256: sha(path.join(out, f)) }));
            fs.writeFileSync(path.join(out, "release-manifest.json"), JSON.stringify({
              version: require("./package.json").version,
              commit: process.env.GITHUB_SHA_VERIFIED,
              workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              builtAt: new Date().toISOString(),
              environment: { runner: process.env.RUNNER_OS, node: process.version, java: process.env.JAVA_HOME || null },
              modelManifestSha256: sha("src/core/ModelManifest.js"),
              artifacts,
            }, null, 2) + "\n");
          ' "$out"
          cat "$out/release-manifest.json"
        env:
          GITHUB_SHA_VERIFIED: ${{ needs.resolve.outputs.sha }}

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voiceisolate-pro-release-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/SHA256SUMS
            android/app/build/outputs/bundle/release/release-manifest.json

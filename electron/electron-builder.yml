appId: com.voiceisolate.pro
productName: VoiceIsolate Pro
copyright: Copyright © 2026 VoiceIsolate Pro

# No native Node addons in this app — skip rebuild that scans parent pnpm workspace.
npmRebuild: false

directories:
  output: dist/electron
  buildResources: electron/resources

# Bundle the real SAM-Audio *runtime package* (worker + vip-sam-runtime) into
# every Desktop install. Model weights download on first use (HF gated).
extraResources:
  - from: services/sam-audio
    to: sam-audio
    filter:
      - '**/*'
      - '!**/.venv*/**'
      - '!**/*.pyc'
  - from: packages/vip-sam-runtime
    to: vip-sam-runtime
    filter:
      - '**/*'
  - from: build/app/models
    to: sam-models
    filter:
      - 'sam-runtime.marker.json'
      - 'sam3-runtime.marker.json'
      - 'sam_audio.onnx'
      - 'README.md'
      - 'sam3/**/*'
  # SAM 3 vision modules (also under build/src via files: build/**/*)
  - from: src/sam3_integration
    to: sam3_integration
    filter:
      - '**/*'

files:
  - build/**/*
  - electron/**/*
  - package.json
  - packages/vip-sam-runtime/**/*
  # Exclude huge optional weights not needed for default offline isolation.
  # Default chain is bsrnn_vocals (~4 MB); demucs FP32 is ~350 MB.
  - '!build/app/models/demucs_v4_fp32.onnx'
  # Keep quantized demucs optional; still large (~142 MB). Include for Maximum Isolation.
  # Comment next line to shrink installer if only bsrnn is required:
  # - '!build/app/models/demucs_v4_quantized.onnx'

extraMetadata:
  main: electron/main.cjs

# Offline-first: all essential models ship inside the app (under build/app/models).
# On first launch, main process seeds {userData}/models for the desktop cache bridge.

win:
  target:
    - nsis
  # Unsigned by default (local/dev). CI can pass CSC_LINK + set VIP_WIN_SIGN=1
  # and flip signAndEditExecutable via env-driven config if needed.
  # signAndEditExecutable:true forces winCodeSign extract (needs SeCreateSymbolicLink).
  signAndEditExecutable: false
  artifactName: VoiceIsolate-Pro-${version}-win-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.music
  artifactName: VoiceIsolate-Pro-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

afterSign: electron/notarize.cjs

linux:
  target:
    - AppImage
  category: AudioVideo
  artifactName: VoiceIsolate-Pro-${version}-linux-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VoiceIsolate Pro
  uninstallDisplayName: VoiceIsolate Pro
  # Offline installer — no online package download during setup
  runAfterFinish: true

publish:
  provider: github
  owner: Joker5514
  repo: VoiceIsolate-Pro

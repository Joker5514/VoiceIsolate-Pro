appId: com.voiceisolate.pro
productName: VoiceIsolate Pro
copyright: Copyright © 2026 VoiceIsolate Pro

# No native Node addons in this app — skip rebuild that scans parent pnpm workspace.
npmRebuild: false

directories:
  output: dist/electron
  buildResources: electron/resources

files:
  - build/**/*
  - electron/**/*
  - package.json

extraMetadata:
  main: electron/main.cjs

win:
  target:
    - nsis
  # Signing runs when CSC_LINK / WIN_CSC_LINK + CSC_KEY_PASSWORD are set (CI).
  # Local unsigned builds: pnpm build:electron sets CSC_IDENTITY_AUTO_DISCOVERY=false.
  signAndEditExecutable: true
  signDlls: true
  artifactName: VoiceIsolate-Pro-${version}-win-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.music
  artifactName: VoiceIsolate-Pro-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

afterSign: electron/notarize.cjs

linux:
  target:
    - AppImage
  category: AudioVideo
  artifactName: VoiceIsolate-Pro-${version}-linux-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

publish:
  provider: github
  owner: Joker5514
  repo: VoiceIsolate-Pro
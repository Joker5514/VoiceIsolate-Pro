<!--
  NeonPulse Visualizer Card — Drop-in HTML partial for VoiceIsolate Pro
  ──────────────────────────────────────────────────────────────────────
  Usage: paste anywhere inside index.html where you want the visualizer.
  The JS will auto-mount because of the data-np-card attribute.

  Live state wiring happens automatically when PipelineState.analyser
  or window.VIPApp.analyserNode is set (see neon-pulse-card.js).
-->

<section class="visualizer-section" aria-labelledby="viz-heading">

  <!-- Section heading (screen-reader accessible) -->
  <h2 id="viz-heading" class="viz-section-title">
    <span class="viz-icon">◈</span>
    Live Output Analysis
  </h2>

  <!--
    data-np-card   → triggers auto-mount by neon-pulse-card.js
    data-np-mode   → starting mode: combined | spectrum | waveform | radial | waterfall
  -->
  <div data-np-card data-np-mode="combined"></div>

</section>

<!--
  ── Optional: second card wired to INPUT (pre-processing) ──
  Uncomment and call card2.connectAnalyser(inputAnalyser) in app.js
-->

</section>

<style>
.visualizer-section {
  padding: 16px 0;
  width: 100%;
}
.viz-section-title {
  font-family: 'JetBrains Mono','Fira Code', monospace;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #4a6070;
  text-transform: uppercase;
  margin: 0 0 10px 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.viz-icon {
  color: #00ffe7;
  font-size: 14px;
  animation: viz-icon-spin 6s linear infinite;
}
@keyframes viz-icon-spin {
  to { transform: rotate(360deg); }
}
@media (max-width: 600px) {
  .visualizer-section { padding: 10px 0; }
  .viz-section-title { font-size: 10px; margin-bottom: 6px; }
}
</style>

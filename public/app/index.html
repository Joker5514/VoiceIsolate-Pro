<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceIsolate Pro — Engineer Mode</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="slider-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="engineer-mode">
    <header class="engineer-header">
      <div class="header-text">
        <h1>VoiceIsolate Pro <span class="badge">Engineer Mode</span></h1>
        <p class="subtitle">52-parameter live mixing console</p>
      </div>
      <button id="resetSlidersBtn">
        <i class="fas fa-rotate-left"></i> Reset All
      </button>
    </header>

    <div class="file-drop-zone" id="fileDropZone" role="button" tabindex="0" aria-label="Upload audio file">
      <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
      <p>Drop an audio file here or click to browse</p>
      <input type="file" id="fileInput" accept="audio/*" tabindex="-1" hidden>
    </div>

    <div class="pipeline-status" id="pipelineStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Waiting for audio file…</span>
    </div>

    <!-- SLIDER GROUPS WILL BE HERE -->
    <div id="sliderGroups">
      <!-- Generated by app.js from STAGES + SLIDER_REGISTRY -->
    </div>
  </div>

  <script src="slider-map.js"></script>
  <script src="app.js"></script>
</body>
</html>

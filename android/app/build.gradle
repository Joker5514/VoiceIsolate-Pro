apply plugin: 'com.android.application'

def releaseSecret = { envValue, propertyValue ->
    for (def value : [envValue, propertyValue]) {
        if (value == null) continue
        def text = value.toString().trim()
        if (!text.isEmpty()) return text
    }
    return null
}
def releaseStoreFile = releaseSecret(System.getenv('ANDROID_KEYSTORE_PATH'), project.findProperty('ANDROID_KEYSTORE_PATH'))
def releaseStorePassword = releaseSecret(System.getenv('ANDROID_KEYSTORE_PASSWORD'), project.findProperty('ANDROID_KEYSTORE_PASSWORD'))
def releaseKeyAlias = releaseSecret(System.getenv('ANDROID_KEY_ALIAS'), project.findProperty('ANDROID_KEY_ALIAS'))
def releaseKeyPassword = releaseSecret(System.getenv('ANDROID_KEY_PASSWORD'), project.findProperty('ANDROID_KEY_PASSWORD'))
def hasReleaseSigningConfig = releaseStoreFile != null &&
    releaseStorePassword != null &&
    releaseKeyAlias != null &&
    releaseKeyPassword != null

android {
    namespace "com.voiceisolatepro.app"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildFeatures {
        // MainActivity uses BuildConfig.DEBUG to disable inspection in release builds.
        buildConfig true
    }
    defaultConfig {
        applicationId "com.voiceisolatepro.app"
        // API 26 = Android 8.0 — minimum for Chrome 88+ WebView builds.
        // Chrome 87 and below have SAB disabled globally regardless of COOP/COEP.
        // API 24 (previous value) allowed Chrome 87 which breaks SAB permanently.
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 250002
        versionName "25.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Do not compress ML/WASM/JS — WebView + ORT need seekable raw assets.
             noCompress 'ttf', 'otf', 'woff', 'woff2', 'onnx', 'wasm', 'js', 'mjs', 'cjs', 'json'
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*.njsproj:!*.sln:!*.suo:!2019'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
            // Enable ProGuard for code shrinking and obfuscation in release builds
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$rootProject.ext.androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && (
            task.name == 'assembleRelease' ||
            task.name == 'bundleRelease' ||
            task.name == 'packageRelease'
        )
    }
    if (!releaseRequested) return
    if (!hasReleaseSigningConfig) {
        throw new GradleException(
            'Release signing is incomplete. Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. Use assembleDebug for an unsigned debug APK.'
        )
    }
    if (!file(releaseStoreFile).isFile()) {
        throw new GradleException("ANDROID_KEYSTORE_PATH is not a file: ${releaseStoreFile}")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}



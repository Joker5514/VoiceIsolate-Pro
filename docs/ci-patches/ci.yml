name: ci

# The single definition of "verified". Pull requests and main pushes run it
# directly; deploy.yml deploys only a SHA this workflow passed, and
# release-build.yml calls it before building any release artifact.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit SHA to verify (defaults to the triggering commit)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # Static + browser + network tiers. The script runs every step, prints a
      # table, and exits non-zero if any step failed.
      - name: pnpm prod:verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prod-verify.mjs --network

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-verify-report
          path: output/prod-verify/report.json
          if-no-files-found: warn
